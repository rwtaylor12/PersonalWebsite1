<body>
  <header id="site-header"></header>

  <main class="container">
    <section class="contact-layout">
      <div>
        <p class="eyebrow">Say hello</p>
        <h1>Let's talk.</h1>
        <p class="lead">Teaching, business, fishing spots, or AI. Send me a note and I'll get back to you.</p>
        <ul class="contact-links">
          <li><span>LinkedIn</span><a href="https://www.linkedin.com/in/rwt12" target="_blank" rel="noopener">linkedin.com/in/rwt12</a></li>
          <li><span>Resume</span><a href="resume.html">View or download</a></li>
        </ul>
      </div>

      <!--
        Messages are delivered by FormSubmit (formsubmit.co) to the address in data-endpoint.
        The very first submission sends an activation email to that inbox; click "Activate" once
        and every message after that arrives normally.
      -->
      <form class="card contact-form" data-contact-form data-endpoint="https://formsubmit.co/ajax/wryan.taylor12@gmail.com" novalidate>
        <label>Name
          <input type="text" name="name" autocomplete="name" required>
        </label>
        <label>Email
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>Message
          <textarea name="message" rows="6" required></textarea>
        </label>
        <!-- Spam trap: real people never see or fill this in. -->
        <input type="text" name="_honey" class="visually-hidden" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input type="hidden" name="_subject" value="New message from your website">
        <input type="hidden" name="_template" value="table">
        <button class="btn" type="submit">Send message</button>
        <p class="form-status" data-form-status role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
